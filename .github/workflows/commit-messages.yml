name: Commit messages

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: shellcheck scripts/check-commit-msg scripts/test-check-commit-msg
      - run: scripts/test-check-commit-msg
      - name: Check the commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for sha in $(git rev-list --no-merges --reverse "$BASE_SHA..$HEAD_SHA"); do
            [ "$(git log -1 --format=%an "$sha")" = 'dependabot[bot]' ] && continue
            errors=$(git log -1 --format=%B "$sha" | scripts/check-commit-msg 2>&1) && continue
            status=1
            short=$(git rev-parse --short "$sha")
            subject=$(git log -1 --format=%s "$sha")
            while IFS= read -r error; do
              echo "::error title=Commit $short::${subject//%/%25}: ${error//%/%25}"
            done <<<"$errors"
          done
          exit "$status"
      - name: Check the description
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          DESCRIPTION: ${{ github.event.pull_request.body }}
        run: |
          errors=$(printf '%s\n' "$DESCRIPTION" | scripts/check-commit-msg --description 2>&1) && exit 0
          while IFS= read -r error; do
            echo "::error title=Pull request description::${error//%/%25}"
          done <<<"$errors"
          exit 1
