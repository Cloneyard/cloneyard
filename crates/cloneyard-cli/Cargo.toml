[package]
name = "cloneyard-cli"
description = "Command-line interface of Cloneyard"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "cloneyard"
path = "src/main.rs"

[[bin]]
name = "cy"
path = "src/bin/cy.rs"

[dependencies]
anyhow.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
cloneyard-api.workspace = true
cloneyard-daemon.workspace = true
cloneyard-rpc.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "rt", "time"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
