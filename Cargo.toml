[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/Cloneyard/cloneyard"

[workspace.dependencies]
anyhow = "1.0.104"
cloneyard-daemon = { path = "crates/cloneyard-daemon" }
cloneyard-rpc = { path = "crates/cloneyard-rpc" }
cloneyard-store = { path = "crates/cloneyard-store" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = "1.54.1"
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ulid = { version = "3.0.0", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
